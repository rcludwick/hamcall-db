[project]
name = "hamcall-db"
version = "0.1.0"
description = "Weekly-rebuilt, openly-licensed amateur radio callsign database, published as a single Parquet artifact."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Rob Ludwick" }]
dependencies = [
    "typer>=0.12",
    "polars>=1.0",
    # Geometry core for POTA park -> Maidenhead grid-set intersection (hdb-f53c).
    # shapely does TRUE polygon intersection (interior rings / multipolygons handled
    # natively — no bbox/convex-hull/hole-fill shortcuts); pyproj reprojects PAD-US's
    # EPSG:5070 boundaries to WGS84 before the grid math. Both are pure-Python-callable
    # (no GDAL); reading the actual PAD-US GeoPackage/GDB needs the build-time `padus`
    # group below.
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.scripts]
hamcall-db = "hamcall_db.build:app"
# Serve the latest generated SQLite .db with Datasette (needs the `serve` group):
#   uv run --group serve hamcall-db-serve dist/
hamcall-db-serve = "hamcall_db.serve:main"

[project.urls]
Homepage = "https://github.com/rcludwick/hamcall-db"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Build-time ONLY: reading the real PAD-US GeoPackage/GDB needs a GDAL-backed reader.
# This is the THIN adapter seam (hamcall_db.sources.padus._read_padus_features) — the
# geometry CORE in padus_grids.py is pure shapely and unit-tested without GDAL or the
# multi-GB national download. Install with `uv sync --group padus` for a real build.
padus = [
    "pyogrio>=0.7",
]
# Optional: only needed to browse the SQLite artifact locally with Datasette.
serve = [
    "datasette>=0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hamcall_db"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
