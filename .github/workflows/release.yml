name: Release

# Weekly build + publish of the hamcall-db Parquet artifact(s).
#
# Schedule: every Monday at 07:00 UTC. Cron is in UTC (GitHub Actions has no
# timezone support); pick a low-traffic, early-week slot so a fresh build is
# ready at the start of each week. Also runnable on demand via the Actions UI
# (workflow_dispatch) for backfills or re-runs.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Required so the workflow can create/move tags and publish releases.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      # Compute the build date ONCE so the tag, asset names, and release title
      # all agree even if the job straddles a UTC midnight boundary.
      - name: Compute build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Carry the previous build forward: the history diff extends the prior
      # history, and the SQLite stable-id ledger requires the prior .db so ids
      # are never reused across weekly rebuilds (au-80c0, au-d824). Tolerant of
      # the first-ever run, when no 'latest' release exists yet.
      - name: Fetch prior 'latest' artifacts
        id: prior
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download latest --dir prior --pattern '*.db' || echo "no prior .db (first run?)"
          gh release download latest --dir prior --pattern '*-history-*.parquet' || echo "no prior history"
          echo "db=$(ls prior/*.db 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"
          echo "history=$(ls prior/*-history-*.parquet 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"

      # The real work: downloads the live upstream sources (FCC ULS, ISED Canada,
      # ACMA, AD1C cty.dat), normalizes/joins/geocodes/enriches, and writes the
      # dated current-state Parquet, history Parquet, and SQLite .db into dist/.
      - name: Build artifacts
        run: |
          set -euo pipefail
          ARGS="--all --out dist/"
          [ -n "${{ steps.prior.outputs.db }}" ] && ARGS="$ARGS --db-in ${{ steps.prior.outputs.db }}"
          [ -n "${{ steps.prior.outputs.history }}" ] && ARGS="$ARGS --history-in ${{ steps.prior.outputs.history }}"
          uv run python -m hamcall_db.build $ARGS

      # Resolve the exact asset paths and confirm the current-state file exists.
      # The history file (au-80c0) is included only if the build produced it.
      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          DATE="${{ steps.date.outputs.date }}"
          CURRENT="dist/hamcall-db-${DATE}.parquet"
          HISTORY="dist/hamcall-db-history-${DATE}.parquet"
          SQLITE="dist/hamcall-db-${DATE}.db"

          if [ ! -f "$CURRENT" ]; then
            echo "::error::Expected current-state artifact not found: $CURRENT"
            ls -la dist/ || true
            exit 1
          fi

          {
            echo "files<<EOF"
            echo "$CURRENT"
            if [ -f "$HISTORY" ]; then
              echo "$HISTORY"
            else
              echo "::warning::History artifact not found: $HISTORY (skipping)"
            fi
            if [ -f "$SQLITE" ]; then
              echo "$SQLITE"
            else
              echo "::warning::SQLite artifact not found: $SQLITE (skipping)"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Dated, immutable release: hamcall-db-YYYY-MM-DD. Consumers pin to this
      # tag when they need reproducibility.
      - name: Publish dated release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "hamcall-db-${{ steps.date.outputs.date }}"
          name: "hamcall-db ${{ steps.date.outputs.date }}"
          body: |
            Weekly hamcall-db build for ${{ steps.date.outputs.date }}.

            Assets:
            - `hamcall-db-${{ steps.date.outputs.date }}.parquet` — current-state dataset (schema is the redistribution contract).
            - `hamcall-db-history-${{ steps.date.outputs.date }}.parquet` — SCD2 change history (if present).
            - `hamcall-db-${{ steps.date.outputs.date }}.db` — SQLite convenience copy: `current` + `history` in one file (stable, never-reused `id`).

            Dataset is for **non-commercial use** (see NOTICE). See the `latest` release for the most recent build.
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true

      # Moving alias: the `latest` tag/release always points at the most recent
      # build. The action updates the existing `latest` release in place and
      # re-points its tag at this commit; the same assets are re-uploaded so
      # `latest` always resolves to a complete, current release.
      - name: Update 'latest' release alias
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest (hamcall-db ${{ steps.date.outputs.date }})"
          body: |
            Rolling alias for the most recent weekly hamcall-db build.
            Currently pointing at the ${{ steps.date.outputs.date }} build.

            Pull this by default; pin to a dated `hamcall-db-YYYY-MM-DD` release when reproducibility matters.
          files: ${{ steps.assets.outputs.files }}
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
