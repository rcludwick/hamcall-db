name: Release

# Weekly build + publish of the hamcall-db Parquet artifact(s).
#
# Schedule: every Monday at 07:00 UTC. Cron is in UTC (GitHub Actions has no
# timezone support); pick a low-traffic, early-week slot so a fresh build is
# ready at the start of each week. Also runnable on demand via the Actions UI
# (workflow_dispatch) for backfills or re-runs.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Required so the workflow can create/move tags and publish releases.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      # Compute the build date ONCE so the tag, asset names, and release title
      # all agree even if the job straddles a UTC midnight boundary.
      - name: Compute build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Carry the previous build forward: the history diff extends the prior
      # history, and the SQLite stable-id ledger requires the prior .db so ids
      # are never reused across weekly rebuilds (au-80c0, au-d824). Tolerant of
      # the first-ever run, when no 'latest' release exists yet.
      - name: Fetch prior 'latest' artifacts
        id: prior
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download latest --dir prior --pattern '*.db' || echo "no prior .db (first run?)"
          gh release download latest --dir prior --pattern '*-history-*.parquet' || echo "no prior history"
          echo "db=$(ls prior/*.db 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"
          echo "history=$(ls prior/*-history-*.parquet 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"

      # The real work: downloads the live upstream sources (FCC ULS, ISED Canada,
      # ACMA, AD1C cty.dat), normalizes/joins/geocodes/enriches, and writes the
      # dated current-state Parquet, history Parquet, and SQLite .db into dist/.
      - name: Build artifacts
        run: |
          set -euo pipefail
          ARGS="--all --out dist/"
          [ -n "${{ steps.prior.outputs.db }}" ] && ARGS="$ARGS --db-in ${{ steps.prior.outputs.db }}"
          [ -n "${{ steps.prior.outputs.history }}" ] && ARGS="$ARGS --history-in ${{ steps.prior.outputs.history }}"
          uv run python -m hamcall_db.build $ARGS

      # Resolve the exact asset paths and split them by LICENSE into two lists:
      #   * cc_files   — CC BY-NC 4.0: callsign dataset, POTA park directory, park-grids.
      #   * odbl_files — ODbL (share-alike): OpenStreetMap-derived grids + LICENSE-ODbL.
      # These feed two SEPARATE releases so the ODbL set is never presented as part of the
      # CC BY-NC dataset (hdb-348e). Exact dated paths are used (never wildcards) because
      # 'hamcall-db-pota-park-grids-*' and 'hamcall-db-*.db' would otherwise straddle both
      # licenses. The current-state file is required; everything else is included if present.
      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          DATE="${{ steps.date.outputs.date }}"

          # CC BY-NC set.
          CURRENT="dist/hamcall-db-${DATE}.parquet"
          HISTORY="dist/hamcall-db-history-${DATE}.parquet"
          SQLITE="dist/hamcall-db-${DATE}.db"
          PARKS="dist/hamcall-db-pota-parks-${DATE}.parquet"
          PARKGRIDS="dist/hamcall-db-pota-park-grids-${DATE}.parquet"

          # ODbL set (OpenStreetMap-derived). LICENSE-ODbL is at the repo root and travels
          # with the OSM artifacts so the share-alike terms are never separated from the data.
          OSMGRIDS="dist/hamcall-db-pota-park-grids-osm-${DATE}.parquet"
          OSMDB="dist/hamcall-db-pota-park-grids-osm-${DATE}.db"
          ODBL_LICENSE="LICENSE-ODbL"

          if [ ! -f "$CURRENT" ]; then
            echo "::error::Expected current-state artifact not found: $CURRENT"
            ls -la dist/ || true
            exit 1
          fi

          # Echo $2 (so it lands in the heredoc) if it exists, else warn to the LOG (stderr)
          # so the warning never pollutes the GITHUB_OUTPUT file list.
          emit() {
            if [ -f "$2" ]; then echo "$2"; else echo "::warning::$1 not found: $2 (skipping)" >&2; fi
          }

          {
            echo "cc_files<<EOF"
            echo "$CURRENT"
            emit "History" "$HISTORY"
            emit "SQLite" "$SQLITE"
            emit "POTA parks" "$PARKS"
            emit "POTA park-grids" "$PARKGRIDS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # The ODbL release is published only when OSM grids were produced this build.
          if [ -f "$OSMGRIDS" ] || [ -f "$OSMDB" ]; then
            {
              echo "odbl_files<<EOF"
              emit "OSM park-grids" "$OSMGRIDS"
              emit "OSM park-grids SQLite" "$OSMDB"
              echo "$ODBL_LICENSE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "has_odbl=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No OSM (ODbL) artifacts produced; skipping the ODbL release"
            echo "has_odbl=false" >> "$GITHUB_OUTPUT"
          fi

      # The repo's single "Latest" badge belongs to the CC-BY-NC `latest` alias. The action
      # defaults make_latest:true, so EVERY other release sets make_latest:false and the
      # `latest` alias is published LAST — otherwise a later release would steal the badge
      # (regression: the dated ODbL release grabbed it). Order: dated CC-BY-NC → dated ODbL →
      # latest-osm → latest (CC-BY-NC).

      # ---- CC BY-NC dated release (callsign dataset + POTA parks/grids) -----------
      # Dated, immutable: hamcall-db-YYYY-MM-DD. Consumers pin to this for reproducibility.
      - name: Publish dated release (CC BY-NC)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "hamcall-db-${{ steps.date.outputs.date }}"
          name: "hamcall-db ${{ steps.date.outputs.date }}"
          body: |
            Weekly hamcall-db build for ${{ steps.date.outputs.date }} — **CC BY-NC 4.0** (non-commercial; see NOTICE).

            Assets:
            - `hamcall-db-${{ steps.date.outputs.date }}.parquet` — current-state callsign dataset (schema is the redistribution contract).
            - `hamcall-db-history-${{ steps.date.outputs.date }}.parquet` — SCD2 change history (if present).
            - `hamcall-db-${{ steps.date.outputs.date }}.db` — SQLite convenience copy: `current` + `history` (+ `pota_parks`, `pota_park_grids`) in one file (stable, never-reused `id`).
            - `hamcall-db-pota-parks-${{ steps.date.outputs.date }}.parquet` — POTA park directory (places, not licensees).
            - `hamcall-db-pota-park-grids-${{ steps.date.outputs.date }}.parquet` — POTA park → 4-char Maidenhead grid sets. **Indicative point grids in this build** (PAD-US polygon boundaries need the build-time `padus` group); treat as approximate until polygon coverage ships.

            OpenStreetMap-derived park grids are **ODbL** (share-alike) and are published SEPARATELY at the `hamcall-db-osm-${{ steps.date.outputs.date }}` / `latest-osm` release — never fold them into this CC BY-NC set.
          files: ${{ steps.assets.outputs.cc_files }}
          make_latest: false
          fail_on_unmatched_files: true

      # ---- ODbL release (OpenStreetMap-derived grids) ----------------------------
      # SEPARATE release so the share-alike ODbL data is never distributed as part of the
      # CC BY-NC set. Published only when this build produced OSM grids.

      - name: Publish dated ODbL release (OpenStreetMap-derived)
        if: steps.assets.outputs.has_odbl == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "hamcall-db-osm-${{ steps.date.outputs.date }}"
          name: "hamcall-db OSM grids ${{ steps.date.outputs.date }} (ODbL)"
          body: |
            OpenStreetMap-derived POTA park → 4-char Maidenhead grid sets for ${{ steps.date.outputs.date }}.

            **License: ODbL 1.0 (Open Database License) — © OpenStreetMap contributors.** This is a
            SEPARATE, share-alike dataset. It is NOT part of the CC BY-NC `hamcall-db` release and must
            not be redistributed as such. Combining it with other data may place that combination under
            ODbL share-alike terms — see `LICENSE-ODbL`.

            Assets:
            - `hamcall-db-pota-park-grids-osm-${{ steps.date.outputs.date }}.parquet` — OSM park-grid sets.
            - `hamcall-db-pota-park-grids-osm-${{ steps.date.outputs.date }}.db` — same, SQLite (`pota_park_grids_osm`).
            - `LICENSE-ODbL` — the governing license + attribution.

            **Indicative point grids in this build** (OSM polygon boundaries need the build-time `osm` group); polygon coverage ships later.
          files: ${{ steps.assets.outputs.odbl_files }}
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update 'latest-osm' release alias (ODbL)
        if: steps.assets.outputs.has_odbl == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest-osm"
          name: "Latest OSM grids (hamcall-db ${{ steps.date.outputs.date }}, ODbL)"
          body: |
            Rolling alias for the most recent OpenStreetMap-derived (**ODbL 1.0**) park-grid build.
            Currently pointing at the ${{ steps.date.outputs.date }} build.

            **© OpenStreetMap contributors** (see `LICENSE-ODbL`). Separate from the CC BY-NC `latest` release;
            do not combine with the CC BY-NC data without honoring ODbL share-alike.
          files: ${{ steps.assets.outputs.odbl_files }}
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Moving alias, published LAST so it owns the repo's "Latest" badge: the `latest`
      # tag/release always points at the most recent CC-BY-NC build.
      - name: Update 'latest' release alias (CC BY-NC)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest (hamcall-db ${{ steps.date.outputs.date }})"
          body: |
            Rolling alias for the most recent weekly hamcall-db build (**CC BY-NC 4.0**).
            Currently pointing at the ${{ steps.date.outputs.date }} build.

            Pull this by default; pin to a dated `hamcall-db-YYYY-MM-DD` release when reproducibility matters.
            OpenStreetMap-derived (ODbL) grids live at the separate `latest-osm` release.
          files: ${{ steps.assets.outputs.cc_files }}
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
